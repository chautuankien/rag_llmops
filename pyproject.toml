[project]
name = "rag-llmops"
version = "0.1.0"
description = ""
authors = [
    {name = "chautuankien",email = "ctkiena2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "beautifulsoup4 (>=4.13.3,<5.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "markdown (>=3.7,<4.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "openai (>=1.66.3,<2.0.0)",
